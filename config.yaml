# Jarvis configuration. Defaults are tuned for RTX 2050 / 4 GB VRAM / 8 GB RAM.
# Environment variables override these values.

brain:
  backend: gemini
  model: gemini-3.7-flash
  adapter_path: ""
  base_url: ""
  temperature: 0.2
  # Keep the output budget reasonable; backends can override this when needed.
  max_tokens: 4096
  use_vision: true
  request_timeout: 120
  conversational: true

perception:
  use_uia: true
  use_ocr: false
  max_elements: 60
  save_screenshots: true

voice:
  engine: gemini
  local_voice: bm_george
  local_speed: 1.0
  model: gemini-3.1-flash-tts-preview
  voice: Kore
  language_code: en-US
  transcription_model: gemini-2.5-flash-lite
  silence_after: 0.6

# Voice is opt-in. Use --voice, JARVIS_VOICE=1, or :voice on.

# Real-Time Gemini Flash Live Voice Model (full-duplex bidirectional streaming
# via Gemini API key / Google Generative Language Live WebSocket).
# The live voice model converses with the user, prompts the text-based Jarvis AI
# to do work, and monitors mid-task progress to narrate what has been done and
# what will be done next.
live_voice:
  enabled: false
  model: models/gemini-2.5-flash-native-audio-latest   # models/gemini-2.5-flash-native-audio-latest
  voice_name: Aoede                      # Aoede, Puck, Charon, Kore, Fenrir
  location: us-central1
  backend: api_key                       # api_key | gcloud
  # Read from JARVIS_LIVE_API_KEY, GEMINI_API_KEY, or Windows Credential Vault.
  # Keep credentials out of this shared project file.
  api_key: ""
  narrate_steps: true                    # proactive mid-task voice narration
  narration_verbosity: normal            # brief | normal | detailed

# Voice mode (Gemini TTS + Gemini STT). Toggle live with ':voice on|off'
# or launch with --voice.
voice_enabled: false

safety:
  # Safe default: require approval before computer-control actions.
  confirm_each_action: true
  max_steps: 30
  self_healing: true
  tot_max_depth: 3
  max_healing_attempts: 3
  auto_refocus: true

  # Add project directories explicitly if Jarvis needs to edit them.
  # allow_paths:
  #   - D:/Projects
  #   - C:/work

data:
  collect_trajectories: true
  trajectory_dir: dataset/data/trajectories
  verify_success: true
  memory_max_chars: 4000
  chat_history_turns: 10

remote:
  relay_url: ""
  state_dir: ""
  result_timeout: 180
  # Require confirmation on remote agents by default.
  require_confirmation: true
