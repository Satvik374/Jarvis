<template>
  <style>
    @font-face {
      font-family: "Orbitron";
      src: url("assets/fonts/Orbitron-Variable.woff2") format("woff2");
      font-weight: 400 900;
      font-style: normal;

    @font-face {

    }

    #root {
      position: absolute;
      inset: 0;
      width: 1920px;

    .f05-plate {
      position: absolute;
      left: 0;

      width: 1920px;
      height: 935px;
      display: block;
      object-fit: cover;
    }
    .f05-field {
      position: absolute;
      left: 0;
      top: 0;
      width: 1920px;
      height: 935px;
      pointer-events: none;
    }
    .f05-mark {
      position: absolute;
      pointer-events: none;
    }
    .f05-box {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(0, 240, 255, 0.45);
    }
    .f05-chip {
      position: absolute;
      left: 0;

      background: #00f0ff;

      line-height: 1;
      padding: 2px 4px;
    }

    /* ---- the lockup: one managed flex stack, centred ---- */
    .f05-lockup {
      position: absolute;
      left: 0;
      top: 372px;
      width: 1920px;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* the gap clears the descender of the 200px wordmark's "j" — a 20px gap
         left the tail of the j sitting on the tagline */
      gap: 54px;
    }
    .f05-word {
      font-family: "Orbitron", sans-serif;
      font-weight: 900;
      font-size: 200px;

      letter-spacing: -0.04em;

    }
    .f05-tag {
      font-family: "JetBrains Mono", monospace;

    .f05-cmd {

    .f05-caret {
      display: inline-block;

      opacity: 0;
    }
    .f05-frag {
      position: absolute;
      background: #00f0ff;
      color: #02070d;
      font-family: "JetBrains Mono", monospace;

      padding: 3px 5px;
      pointer-events: none;
    }
  </style>

  <div id="root" data-composition-id="05-local-intelligence" data-width="1920" data-height="1080">
    <img
      id="f05-plate"
      class="clip f05-plate"
      src="assets/som-ui-home-clean-raw.png"
      alt=""
      data-start="0"
      data-duration="2.987"
      data-track-index="0"
    />
    <div class="f05-field"></div>

    <div class="f05-lockup">
      <div class="f05-word">jarvis</div>
      <div class="f05-tag">local intelligence</div>
      <div class="f05-cmd"><span class="f05-cmd-text"></span><span class="f05-caret">_</span></div>
    </div>
  </div>

  <script>
    (function () {
      const FID = "05-local-intelligence";
      const root = document.getElementById("root");

      /* The settled mark field, carried from frame 4 at exact geometry. */
      const MARKS = [
        [0, 32, 16, 205, 51], [1, 79, 17, 185, 40], [2, 79, 38, 205, 49], [3, 1454, 17, 1540, 50],
        [4, 1549, 17, 1590, 50], [5, 1599, 17, 1640, 50], [6, 1649, 17, 1690, 50], [7, 1699, 17, 1740, 50],
        [8, 1776, 28, 1813, 39], [9, 1856, 17, 1888, 50], [10, 32, 82, 380, 888], [11, 43, 91, 105, 126],
        [12, 108, 94, 171, 123], [13, 174, 94, 237, 123], [14, 240, 91, 303, 126], [15, 306, 91, 369, 126],
        [16, 47, 144, 137, 155], [17, 343, 146, 365, 155], [18, 33, 175, 379, 887], [19, 47, 193, 70, 202],
        [20, 110, 192, 142, 201], [21, 110, 204, 251, 216], [22, 110, 236, 131, 246], [23, 110, 248, 323, 261],
        [24, 110, 292, 323, 305], [25, 110, 336, 296, 349], [26, 110, 380, 323, 393], [27, 110, 424, 323, 437],
        [28, 110, 468, 323, 481], [29, 110, 512, 312, 538], [30, 391, 82, 1365, 888], [31, 731, 832, 745, 847],
        [32, 774, 814, 858, 825], [33, 774, 852, 866, 865], [34, 986, 101, 1038, 124], [35, 1042, 102, 1119, 125],
        [36, 1123, 102, 1182, 125], [37, 1186, 102, 1270, 125], [38, 1274, 102, 1345, 125],
        [39, 1212, 138, 1276, 158], [40, 1284, 138, 1351, 158],
      ];
      const field = document.querySelector(".f05-field");
      const centers = {};
      MARKS.forEach((m) => {
        const x0 = m[1];
        const y0 = m[2];
        const w = m[3] - x0;
        const h = m[4] - y0;
        const wrap = document.createElement("div");
        wrap.className = "f05-mark";
        wrap.style.left = x0 + "px";
        wrap.style.top = y0 + "px";
        wrap.style.width = w + "px";
        wrap.style.height = h + "px";
        if (w >= 16 && h >= 10 && w * h <= 60000) {
          const box = document.createElement("div");
          box.className = "f05-box";
          wrap.appendChild(box);
        }
        // No number chips here: the marks are boxes-only texture by this beat.
        field.appendChild(wrap);
        centers[m[0]] = { x: x0, y: y0 - 15 };
      });

      /* The fragments that regroup into the wordmark: real mark ids, at their
         real captured positions, converging on the lockup. */
      const FRAGMENTS = [3, 21, 24, 31, 37, 40];
      const fragEls = FRAGMENTS.map((id) => {
        const el = document.createElement("div");
        el.className = "f05-frag";
        // intentional layering: a fragment starts on its own mark, then crosses the wordmark
        el.setAttribute("data-layout-allow-overlap", "");
        el.textContent = String(id);
        el.style.left = centers[id].x + "px";
        el.style.top = centers[id].y + "px";
        root.appendChild(el);
        return { el: el, c: centers[id] };
      });

      const cmdEl = document.querySelector(".f05-cmd-text");
      const caret = document.querySelector(".f05-caret");

      const tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0-1.5s): the fragments lift off and regroup into the word ----
      tl.fromTo(".f05-plate", { opacity: 0.28 }, { opacity: 0.22, duration: 0.4, ease: "power1.out" }, 0);
      tl.fromTo(".f05-field", { opacity: 0.28 }, { opacity: 0.22, duration: 0.4, ease: "power1.out" }, 0);

      fragEls.forEach((f, i) => {
        const dx = 934 - f.c.x;
        const dy = 470 - f.c.y;
        tl.fromTo(
          f.el,
          { x: 0, y: 0, opacity: 1 },
          { x: dx, y: dy, duration: 0.95, ease: "power3.inOut" },
          0.12 + i * 0.045,
        );
        tl.to(f.el, { opacity: 0, duration: 0.3, ease: "power1.in" }, 0.85 + i * 0.045);
      });
      tl.fromTo(".f05-word", { opacity: 0, scale: 0.94, y: 10 }, { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.85);

      // ---- Scene 2 (1.5-2.987s): the tagline seats and the real command types ----
      tl.fromTo(".f05-tag", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.5);

      const CMD = [
        { t: 0.0, text: "" },
        { t: 0.18, text: "python" },
        { t: 0.44, text: "python run.py" },
        { t: 0.78, text: "python run.py --browser" },
      ];
      const d = { t: 0 };
      tl.to(
        d,
        {
          t: 0.9,
          duration: 0.9,
          ease: "none",
          onUpdate: () => {
            let s = "";
            for (let i = CMD.length - 1; i >= 0; i--) {
              if (d.t >= CMD[i].t) {
                s = CMD[i].text;
                break;
              }
            }
            cmdEl.textContent = s;
          },
        },
        1.85,
      );
      const cb = { p: 0 };
      tl.to(
        cb,
        {
          p: Math.PI * 2 * 3,
          duration: 1.1,
          ease: "none",
          onUpdate: () => {
            caret.style.opacity = Math.sin(cb.p) > 0 ? "1" : "0";
          },
        },
        1.85,
      );
      tl.set(caret, { opacity: 0 }, 2.8);

      window.__timelines[FID] = tl;
    })();
  </script>
</template>
