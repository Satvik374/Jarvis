<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Ninja Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #14151f; display: flex;
               align-items: center; justify-content: center; }
  canvas { image-rendering: pixelated; width: min(100vw, 1200px); max-height: 100vh; }
</style>
</head>
<body>
<canvas id="game" width="800" height="448"></canvas>
<script>
'use strict';
// ---------- constants ----------
const TILE = 32, VIEW_W = 800, VIEW_H = 448, STEP = 1 / 60;
const SOLID = '#=B?US';
const ACC = 0.5, FRICTION = 0.82, MAXV = 3.4, GRAV = 0.55, MAXFALL = 12, JUMPV = -11;
const cvs = document.getElementById('game'), ctx = cvs.getContext('2d');
ctx.imageSmoothingEnabled = false;

// ---------- assets ----------
const IMG = {};
function loadAssets(names) {
  return Promise.all(names.map(n => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => { IMG[n] = im; res(); };
    im.onerror = () => rej(new Error('failed to load assets/' + n + '.png'));
    im.src = 'assets/' + n + '.png';
  })));
}

// ---------- level ----------
// grid of chars: '#' ground '=' dirt 'B' brick '?' qblock 'U' used 'S' stone
// 'o' coin 'E' enemy spawn 'P' player spawn 'F' flag
const LEVEL_W = 140, LEVEL_H = 14;
function buildLevel() {
  const g = Array.from({ length: LEVEL_H }, () => Array(LEVEL_W).fill(' '));
  const pits = [[30, 32], [55, 57], [85, 88], [110, 112]];
  for (let c = 0; c < LEVEL_W; c++) {
    if (pits.some(([a, b]) => c >= a && c <= b)) continue;
    g[12][c] = '#'; g[13][c] = '=';
  }
  const put = (r, c, s) => { for (let i = 0; i < s.length; i++) g[r][c + i] = s[i]; };
  put(8, 10, '?');
  put(8, 20, 'B?B?B');
  put(6, 21, 'ooo');
  put(8, 46, '?');
  put(4, 60, 'BBBB');
  put(8, 61, '??');
  put(8, 70, '?');
  put(7, 30, 'ooo'); put(7, 55, 'ooo'); put(7, 85, 'oooo');
  for (let i = 0; i < 4; i++) for (let r = 11 - i; r <= 11; r++) g[r][95 + i] = 'S';
  put(5, 96, 'oooo');
  for (let i = 0; i < 4; i++) for (let r = 11 - i; r <= 11; r++) g[r][120 + i] = 'S';
  for (const c of [18, 26, 40, 50, 64, 75, 92, 105, 116]) g[11][c] = 'E';
  g[11][2] = 'P'; g[11][130] = 'F';
  return g;
}

// ---------- state ----------
const state = {
  mode: 'title',   // title | play | dying | win | over
  grid: [], spawn: { x: 64, y: 352 }, flagX: 0,
  player: null, enemies: [], shurikens: [], particles: [], popCoins: [],
  score: 0, coins: 0, lives: 3, camX: 0, time: 0, dieTimer: 0,
};

function resetLevel(fullRestart) {
  if (fullRestart) { state.score = 0; state.coins = 0; state.lives = 3; }
  state.grid = buildLevel();
  state.enemies = []; state.shurikens = []; state.particles = []; state.popCoins = [];
  for (let r = 0; r < LEVEL_H; r++) for (let c = 0; c < LEVEL_W; c++) {
    const ch = state.grid[r][c];
    if (ch === 'P') {
      state.grid[r][c] = ' ';
      state.spawn = { x: c * TILE + 7, y: r * TILE + 6 };
    } else if (ch === 'E') {
      state.grid[r][c] = ' ';
      state.enemies.push({ x: c * TILE + 4, y: r * TILE + 12, w: 24, h: 20,
                           vx: -0.7, vy: 0, alive: true, active: false, squash: 0, anim: 0 });
    } else if (ch === 'F') {
      state.grid[r][c] = ' ';
      state.flagX = c * TILE;
    }
  }
  state.player = { x: state.spawn.x, y: state.spawn.y, w: 18, h: 26, vx: 0, vy: 0,
                   dir: 1, onGround: false, anim: 0, coyote: 0, jumpBuf: 0, throwCd: 0 };
  state.camX = 0;
}

// ---------- tiles ----------
function tileAt(px, py) {
  const c = Math.floor(px / TILE), r = Math.floor(py / TILE);
  if (c < 0 || c >= LEVEL_W || r < 0 || r >= LEVEL_H) return ' ';
  return state.grid[r][c];
}
function solidTiles(x, y, w, h) {
  const out = [];
  const c0 = Math.floor(x / TILE), c1 = Math.floor((x + w - 0.01) / TILE);
  const r0 = Math.floor(y / TILE), r1 = Math.floor((y + h - 0.01) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (r < 0 || r >= LEVEL_H || c < 0 || c >= LEVEL_W) continue;
    if (SOLID.includes(state.grid[r][c])) out.push({ c, r });
  }
  return out;
}
function moveX(e) {
  e.x += e.vx;
  const hits = solidTiles(e.x, e.y, e.w, e.h);
  if (!hits.length) return false;
  if (e.vx > 0) e.x = Math.min(...hits.map(t => t.c)) * TILE - e.w - 0.01;
  else e.x = (Math.max(...hits.map(t => t.c)) + 1) * TILE + 0.01;
  return true;
}
function moveY(e, onHeadBump) {
  e.y += e.vy;
  const hits = solidTiles(e.x, e.y, e.w, e.h);
  if (!hits.length) { e.onGround = false; return; }
  if (e.vy > 0) {
    e.y = Math.min(...hits.map(t => t.r)) * TILE - e.h - 0.01;
    e.vy = 0; e.onGround = true;
  } else if (e.vy < 0) {
    const row = Math.max(...hits.map(t => t.r));
    e.y = (row + 1) * TILE + 0.01;
    e.vy = 0;
    if (onHeadBump) {
      // bump the tile nearest the player's centre
      const cx = e.x + e.w / 2;
      const best = hits.filter(t => t.r === row)
        .sort((a, b) => Math.abs((a.c + 0.5) * TILE - cx) - Math.abs((b.c + 0.5) * TILE - cx))[0];
      onHeadBump(best.c, best.r);
    }
  }
}

// ---------- blocks / coins ----------
function bumpBlock(c, r) {
  const ch = state.grid[r][c];
  if (ch === 'B') {
    state.grid[r][c] = ' ';
    state.score += 50;
    for (let i = 0; i < 6; i++) state.particles.push({
      x: c * TILE + 16, y: r * TILE + 16, vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 6 - 1, life: 0.8, color: '#9e523c', size: 5 });
    sfx('brick');
  } else if (ch === '?') {
    state.grid[r][c] = 'U';
    state.coins++; state.score += 200;
    state.popCoins.push({ x: c * TILE + 16, y: r * TILE - 8, vy: -5.5, t: 0 });
    sfx('coin');
  } else {
    sfx('bump');
  }
}
function collectTileCoins(p) {
  const c0 = Math.floor(p.x / TILE), c1 = Math.floor((p.x + p.w) / TILE);
  const r0 = Math.floor(p.y / TILE), r1 = Math.floor((p.y + p.h) / TILE);
  for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) {
    if (r >= 0 && r < LEVEL_H && c >= 0 && c < LEVEL_W && state.grid[r][c] === 'o') {
      state.grid[r][c] = ' ';
      state.coins++; state.score += 100;
      sfx('coin');
    }
  }
}

// ---------- input ----------
const keys = {};
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) e.preventDefault();
  initAudio();
  keys[e.key.toLowerCase()] = true;
  if (e.key === 'Enter') {
    if (state.mode === 'title') { state.mode = 'play'; }
    else if (state.mode === 'win' || state.mode === 'over') { resetLevel(true); state.mode = 'play'; }
  }
  if (isJumpKey(e.key) && state.mode === 'play' && !e.repeat) state.player.jumpBuf = 6;
});
addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
  // variable jump height: cut upward speed on release
  if (isJumpKey(e.key) && state.mode === 'play' && state.player.vy < -4) state.player.vy = -4;
});
function isJumpKey(k) { return k === ' ' || k === 'ArrowUp' || k.toLowerCase() === 'w'; }
const leftHeld  = () => keys['arrowleft'] || keys['a'];
const rightHeld = () => keys['arrowright'] || keys['d'];
const throwHeld = () => keys['x'] || keys['j'];

// ---------- player ----------
function updatePlayer(p, dt) {
  if (leftHeld())  { p.vx -= ACC; p.dir = -1; }
  if (rightHeld()) { p.vx += ACC; p.dir = 1; }
  if (!leftHeld() && !rightHeld() && p.onGround) p.vx *= FRICTION;
  if (Math.abs(p.vx) < 0.05) p.vx = 0;
  p.vx = Math.max(-MAXV, Math.min(MAXV, p.vx));

  p.coyote = p.onGround ? 6 : Math.max(0, p.coyote - 1);
  p.jumpBuf = Math.max(0, p.jumpBuf - 1);
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = JUMPV; p.coyote = 0; p.jumpBuf = 0; p.onGround = false;
    sfx('jump');
  }

  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  if (moveX(p)) p.vx = 0;
  if (p.x < 0) { p.x = 0; p.vx = 0; }
  moveY(p, bumpBlock);

  collectTileCoins(p);

  p.throwCd = Math.max(0, p.throwCd - dt);
  if (throwHeld() && p.throwCd === 0 && state.shurikens.length < 2) {
    state.shurikens.push({ x: p.x + p.w / 2 + p.dir * 10, y: p.y + 8, vx: p.dir * 7, t: 0 });
    p.throwCd = 0.35;
    sfx('throw');
  }

  if (Math.abs(p.vx) > 0.3) p.anim += dt; else p.anim += dt * 0.4;

  if (p.x + p.w > state.flagX + 6) winLevel();
  if (p.y > LEVEL_H * TILE + 40) startDeath(false);
}

// ---------- enemies ----------
function updateEnemy(en, dt) {
  if (!en.active) {
    if (en.x < state.camX + VIEW_W + 64) en.active = true;
    else return;
  }
  if (en.squash > 0) { en.squash -= dt; if (en.squash <= 0) en.alive = false; return; }
  en.anim += dt;
  en.vy = Math.min(en.vy + GRAV, MAXFALL);
  if (moveX(en)) en.vx = -en.vx;
  moveY(en, null);
  if (en.onGround) {
    const ahead = en.vx > 0 ? en.x + en.w + 2 : en.x - 2;
    if (!SOLID.includes(tileAt(ahead, en.y + en.h + 4))) en.vx = -en.vx;
  }
  const p = state.player;
  if (overlaps(p, en)) {
    if (p.vy > 0 && p.y + p.h - en.y < 14) {
      en.squash = 0.5; en.vx = 0;
      p.vy = -7; state.score += 100;
      sfx('stomp');
    } else {
      startDeath(true);
    }
  }
}
function overlaps(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---------- shurikens / particles / pop coins ----------
function updateShurikens(dt) {
  for (const s of state.shurikens) {
    s.x += s.vx; s.t += dt;
    if (SOLID.includes(tileAt(s.x, s.y + 6))) s.dead = true;
    for (const en of state.enemies) {
      if (en.alive && en.squash <= 0 && en.active &&
          s.x > en.x - 6 && s.x < en.x + en.w + 6 && s.y + 6 > en.y && s.y + 6 < en.y + en.h) {
        en.alive = false; s.dead = true;
        state.score += 100;
        for (let i = 0; i < 6; i++) state.particles.push({
          x: en.x + en.w / 2, y: en.y + en.h / 2, vx: (Math.random() - 0.5) * 5,
          vy: -Math.random() * 5 - 1, life: 0.6, color: '#c43c36', size: 4 });
        sfx('stomp');
      }
    }
    if (s.x < state.camX - 40 || s.x > state.camX + VIEW_W + 40) s.dead = true;
  }
  state.shurikens = state.shurikens.filter(s => !s.dead);
}
function updateFx(dt) {
  for (const pt of state.particles) {
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.3; pt.life -= dt;
  }
  state.particles = state.particles.filter(pt => pt.life > 0);
  for (const pc of state.popCoins) {
    pc.y += pc.vy; pc.vy += 0.35; pc.t += dt;
  }
  state.popCoins = state.popCoins.filter(pc => pc.t < 0.55);
}

// ---------- life cycle ----------
function startDeath(hop) {
  if (state.mode !== 'play') return;
  state.mode = 'dying';
  state.dieTimer = 1.4;
  state.player.vy = hop ? -9 : state.player.vy;
  state.player.vx = 0;
  sfx('hurt');
}
function updateDying(dt) {
  const p = state.player;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);
  p.y += p.vy;
  state.dieTimer -= dt;
  if (state.dieTimer <= 0) {
    state.lives--;
    if (state.lives < 0) { state.mode = 'over'; sfx('over'); }
    else { resetLevel(false); state.mode = 'play'; }
  }
}
function winLevel() {
  if (state.mode !== 'play') return;
  state.mode = 'win';
  state.score += 1000;
  sfx('win');
}

// ---------- audio (all procedural, no files) ----------
let audio = null;
function initAudio() { if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(f0, f1, dur, type, delay, vol) {
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator(), g = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, t);
  osc.frequency.linearRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  osc.connect(g).connect(audio.destination);
  osc.start(t); osc.stop(t + dur + 0.02);
}
function sfx(name) {
  if (!audio) return;
  switch (name) {
    case 'jump':   tone(280, 560, 0.12, 'square', 0, 0.12); break;
    case 'coin':   tone(988, 988, 0.06, 'square', 0, 0.12);
                   tone(1319, 1319, 0.14, 'square', 0.06, 0.12); break;
    case 'stomp':  tone(220, 80, 0.15, 'square', 0, 0.15); break;
    case 'brick':  tone(160, 40, 0.2, 'sawtooth', 0, 0.18); break;
    case 'bump':   tone(120, 90, 0.08, 'square', 0, 0.12); break;
    case 'hurt':   tone(300, 60, 0.45, 'sawtooth', 0, 0.15); break;
    case 'throw':  tone(700, 300, 0.06, 'square', 0, 0.1); break;
    case 'win':    [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.14, 'square', i * 0.13, 0.12)); break;
    case 'over':   [392, 330, 262, 196].forEach((f, i) => tone(f, f, 0.2, 'square', i * 0.18, 0.12)); break;
  }
}

// ---------- render ----------
function render() {
  const cam = Math.floor(state.camX);
  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, 384);
  sky.addColorStop(0, '#1a1c2c'); sky.addColorStop(1, '#444a6e');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // parallax bg (768x224, bottom meets ground line y=384)
  const bg = IMG.bg, bx = -(cam * 0.35 % bg.width);
  for (let i = 0; i <= Math.ceil(VIEW_W / bg.width) + 1; i++)
    ctx.drawImage(bg, Math.floor(bx) + i * bg.width, 384 - bg.height);
  ctx.fillStyle = '#262c44'; ctx.fillRect(0, 384, VIEW_W, VIEW_H - 384);

  // tiles + coins
  const TI = { '#': 0, '=': 1, 'B': 2, '?': 3, 'U': 4, 'S': 5 };
  const c0 = Math.floor(cam / TILE), c1 = c0 + Math.ceil(VIEW_W / TILE) + 1;
  for (let r = 0; r < LEVEL_H; r++) for (let c = c0; c <= c1 && c < LEVEL_W; c++) {
    const ch = state.grid[r][c];
    if (ch in TI) ctx.drawImage(IMG.tiles, TI[ch] * TILE, 0, TILE, TILE, c * TILE - cam, r * TILE, TILE, TILE);
    else if (ch === 'o') {
      const f = Math.floor(state.time * 8) % 4;
      ctx.drawImage(IMG.items, f * TILE, 0, TILE, TILE, c * TILE - cam, r * TILE, TILE, TILE);
    }
  }
  // flag
  ctx.drawImage(IMG.flag, state.flagX - cam, 384 - 96);
  // pop coins
  for (const pc of state.popCoins) {
    const f = Math.floor(pc.t * 16) % 4;
    ctx.drawImage(IMG.items, f * TILE, 0, TILE, TILE, pc.x - 16 - cam, pc.y - 16, TILE, TILE);
  }
  // enemies
  for (const en of state.enemies) {
    if (!en.alive) continue;
    const f = en.squash > 0 ? 2 : Math.floor(en.anim * 6) % 2;
    ctx.drawImage(IMG.enemy, f * TILE, 0, TILE, TILE, Math.floor(en.x) - 4 - cam, Math.floor(en.y) - 11, TILE, TILE);
  }
  // shurikens
  for (const s of state.shurikens) {
    const f = 4 + Math.floor(s.t * 20) % 2;
    ctx.drawImage(IMG.items, f * TILE, 0, TILE, TILE, Math.floor(s.x) - 16 - cam, Math.floor(s.y) - 10, TILE, TILE);
  }
  // particles
  for (const pt of state.particles) {
    ctx.fillStyle = pt.color;
    ctx.fillRect(Math.floor(pt.x) - cam, Math.floor(pt.y), pt.size, pt.size);
  }
  // player
  renderPlayer(cam);
  renderHud();
  if (state.mode === 'title') renderPanel('NINJA RUN',
    ['ARROWS / WASD  MOVE      SPACE  JUMP      X  SHURIKEN', 'STOMP OR SHURIKEN THE ONI  ·  REACH THE BANNER', '', 'PRESS ENTER TO START']);
  if (state.mode === 'win') renderPanel('LEVEL CLEAR!',
    ['SCORE  ' + fmtScore(), '', 'PRESS ENTER TO PLAY AGAIN']);
  if (state.mode === 'over') renderPanel('GAME OVER',
    ['SCORE  ' + fmtScore(), '', 'PRESS ENTER TO RETRY']);
}
function playerFrame(p) {
  if (state.mode === 'dying') return 8;
  if (!p.onGround) return p.vy < 0 ? 8 : 9;
  if (Math.abs(p.vx) > 0.3) return 2 + Math.floor(p.anim * 14) % 6;
  return Math.floor(p.anim * 3) % 2;
}
function renderPlayer(cam) {
  const p = state.player;
  const f = playerFrame(p);
  const sx = Math.floor(p.x) - 7 - cam, sy = Math.floor(p.y) - 5;
  ctx.save();
  if (p.dir < 0) {
    ctx.translate(sx + 16, sy + 16); ctx.scale(-1, 1);
    ctx.drawImage(IMG.ninja, f * TILE, 0, TILE, TILE, -16, -16, TILE, TILE);
  } else {
    ctx.drawImage(IMG.ninja, f * TILE, 0, TILE, TILE, sx, sy, TILE, TILE);
  }
  ctx.restore();
}
function fmtScore() { return String(state.score).padStart(6, '0'); }
function renderHud() {
  ctx.font = 'bold 16px "Courier New", monospace';
  ctx.textAlign = 'left';
  const line = 'SCORE ' + fmtScore() + '    COINS x' + state.coins + '    LIVES x' + Math.max(0, state.lives);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText(line, 13, 25);
  ctx.fillStyle = '#fff';
  ctx.fillText(line, 12, 24);
}
function renderPanel(title, lines) {
  ctx.fillStyle = 'rgba(10,10,20,0.7)';
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e8b84a';
  ctx.font = 'bold 52px "Courier New", monospace';
  ctx.fillText(title, VIEW_W / 2, 170);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px "Courier New", monospace';
  lines.forEach((l, i) => ctx.fillText(l, VIEW_W / 2, 220 + i * 26));
}

// ---------- main loop ----------
function update(dt) {
  state.time += dt;
  if (state.mode === 'play') {
    updatePlayer(state.player, dt);
    for (const en of state.enemies) if (en.alive) updateEnemy(en, dt);
    state.enemies = state.enemies.filter(en => en.alive || en.squash > 0);
    updateShurikens(dt);
  } else if (state.mode === 'dying') {
    updateDying(dt);
  }
  updateFx(dt);
  if (state.mode === 'play' || state.mode === 'win') {
    const target = state.player.x - VIEW_W * 0.4;
    state.camX += (target - state.camX) * 0.15;
    state.camX = Math.max(0, Math.min(state.camX, LEVEL_W * TILE - VIEW_W));
  }
}
let last = 0, acc = 0;
function frame(ts) {
  const dt = Math.min((ts - last) / 1000, 0.1);
  last = ts;
  acc += dt;
  while (acc > STEP) { update(STEP); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

loadAssets(['ninja', 'enemy', 'tiles', 'items', 'flag', 'bg']).then(() => {
  resetLevel(true);
  requestAnimationFrame(frame);
}).catch(e => {
  document.body.innerHTML = '<p style="color:#fff;font-family:monospace">' + e.message +
    ' — run gen_assets.py first, and serve this folder over http.</p>';
});
</script>
</body>
</html>
